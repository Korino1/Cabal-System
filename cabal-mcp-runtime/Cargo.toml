[package]
name = "cabal-mcp-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = true }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
flate2 = "1.0"
url = "2.5"
wait-timeout = "0.2"
